{% extends "core/base.html" %}
{% block title %}Leave Summary{% endblock %}
{% block content %}
<h1>Leave Summary</h1>
<table>
  <tr>
    <th>Leave Type</th>
    <th>Status</th>
  </tr>
  {% for row in summary %}
  <tr>
    <td>{{ row.leave_type__name }}</td>
    <td>{{ row.status }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="2">No data</td></tr>
  {% endfor %}
</table>
{% endblock %}
