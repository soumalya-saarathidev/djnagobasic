<!-- core/templates/core/department_form.html -->
{% extends 'core/base.html' %}
{% block title %}Add/Edit Department{% endblock %}
{% block content %}
<h2>{{ view.title }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'departments:list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
