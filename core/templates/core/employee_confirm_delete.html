<!-- core/templates/core/employee_confirm_delete.html -->
{% extends 'core/base.html' %}
{% block title %}Delete Employee{% endblock %}
{% block content %}
<h2>Are you sure you want to delete {{ object.first_name }} {{ object.last_name }}?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{% url 'employees:list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
