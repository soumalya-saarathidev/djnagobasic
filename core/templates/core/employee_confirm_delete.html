{% extends "core/base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<h1>Delete {{ object.get_full_name }}?</h1>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'core:employees:list' %}">Cancel</a>
</form>
{% endblock %}
