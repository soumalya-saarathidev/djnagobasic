<!-- core/templates/core/department_detail.html -->
{% extends 'core/base.html' %}
{% block title %}Department Details{% endblock %}
{% block content %}
<h2>{{ object.name }}</h2>
<p><strong>Created on:</strong> {{ object.created_at }}</p>
<p><strong>Updated on:</strong> {{ object.updated_at }}</p>
<a href="{% url 'departments:list' %}" class="btn btn-secondary">Back</a>
{% endblock %}
